<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Engineering in practice: booking integrity, traceable inventory, and local-first Git"><style>text{font-family:Arial,Helvetica,sans-serif}.trace{stroke-dasharray:6 12;animation:run 4s linear infinite}@keyframes run{to{stroke-dashoffset:-72}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="1280" height="300" rx="18" fill="#0c101a"/><text x="32" y="35" fill="#8495ae" font-size="11" letter-spacing="3">ENGINEERING IN PRACTICE</text><text x="32" y="73" fill="#edf1f8" font-size="27" font-weight="700">The details behind the interface.</text><rect x="32" y="101" width="392" height="173" rx="10" fill="#131a27" stroke="#27334a"/><path class="trace" d="M48 102H408" stroke="#67e8f9"/><text x="52" y="129" fill="#67e8f9" font-size="10" letter-spacing="2">SLOTFORGE</text><text x="52" y="160" fill="#f2f5fc" font-size="21" font-weight="700">Reservation integrity</text><circle cx="55" cy="187" r="2" fill="#67e8f9"/><text x="67" y="191" fill="#aebbd0" font-size="12">Membership checks + booking ownership</text><circle cx="55" cy="212" r="2" fill="#67e8f9"/><text x="67" y="216" fill="#aebbd0" font-size="12">Database constraints + idempotency</text><circle cx="55" cy="237" r="2" fill="#67e8f9"/><text x="67" y="241" fill="#aebbd0" font-size="12">Verification + revocable sessions</text><rect x="448" y="101" width="392" height="173" rx="10" fill="#131a27" stroke="#27334a"/><path class="trace" d="M464 102H824" stroke="#a5b4fc"/><text x="468" y="129" fill="#a5b4fc" font-size="10" letter-spacing="2">STOCKFLOW</text><text x="468" y="160" fill="#f2f5fc" font-size="21" font-weight="700">Traceable operations</text><circle cx="471" cy="187" r="2" fill="#a5b4fc"/><text x="483" y="191" fill="#aebbd0" font-size="12">Purchases, receipts and location transfers</text><circle cx="471" cy="212" r="2" fill="#a5b4fc"/><text x="483" y="216" fill="#aebbd0" font-size="1