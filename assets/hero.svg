ear.</text><rect x="726" y="132" width="312" height="55" rx="8" fill="#161824" stroke="#363349"/><rect x="726" y="142" width="3" height="35" rx="1" fill="#8ad5dc"/><text x="745" y="153" fill="#8ad5dc" font-size="10" font-weight="bold" letter-spacing="1.3">02  LOGIC</text><text x="745" y="174" fill="#b2b3c5" font-size="12" font-weight="normal" >Give every action a rule.</text><rect x="726" y="198" width="312" height="55" rx="8" fill="#161824" stroke="#363349"/><rect x="726" y="208" width="3" height="35" rx="1" fill="#b0d49a"/><text x="745" y="219" fill="#b0d49a" font-size="10" font-weight="bold" letter-spacing="1.3">03  DATA</text><text x="745" y="240" fill="#b2b3c5" font-size="12" font-weight="normal" >Keep the state dependable.</text><text x="730" y="301" fill="#b4a4d8" font-size="10" font-weight="normal" letter-spacing="1">DESIGN → BUILD → VERIFY → SHIP</text></g></svg>